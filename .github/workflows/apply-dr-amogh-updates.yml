name: Apply Dr Amogh updates

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply requested fixes
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$COMMIT_MESSAGE" = "[bot] Apply Dr Amogh updates" ]; then
            echo "Bot update commit already applied. Nothing to do."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          booking = Path('js/booking-widget.js')
          text = booking.read_text()
          text = text.replace('₹1,200', '₹500')
          old = '''      const input = document.getElementById("bookDateInput");
      input.addEventListener("change", () => {'''
          new = '''      const input = document.getElementById("bookDateInput");
      const field = root.querySelector(".date-picker-field");
      if(field){
        field.addEventListener("pointerdown", (event) => {
          if(event.target === input) return;
          event.preventDefault();
          try {
            if(typeof input.showPicker === "function") input.showPicker();
            else input.click();
          } catch(e) {
            try { input.click(); } catch(_) { input.focus(); }
          }
        });
      }
      input.addEventListener("change", () => {'''
          if old not in text:
              raise SystemExit('Expected booking date handler was not found')
          text = text.replace(old, new, 1)
          booking.write_text(text)

          index = Path('index.html')
          text = index.read_text()
          text = text.replace(
              'He completed his MBBS and later pursued MD in General Medicine, building his clinical career around the assessment and management of a broad range of medical concerns.',
              'He completed his MBBS at Bangalore Medical College and later pursued MD in General Medicine at Mandya Institute of Medical Science, building his clinical career around the assessment and management of a broad range of medical concerns.'
          )
          text = text.replace(
              '<strong>MBBS → MD General Medicine</strong><small>His medical training progressed from MBBS to postgraduate training in General Medicine.</small>',
              '<strong>MBBS → MD General Medicine</strong><small>MBBS — Bangalore Medical College<br>MD General Medicine — Mandya Institute of Medical Science</small>'
          )
          text = text.replace('&#8377;1,200', '&#8377;500')
          index.write_text(text)

          assistant = Path('js/site-assistant.js')
          text = assistant.read_text()
          text = text.replace('15-minute consultation for ₹1,200', '15-minute consultation for ₹500')
          text = text.replace(
              'Dr. Amogh G is listed as MBBS, MD General Medicine, with 12+ years of clinical experience at Pragati Hospital, Mandya.',
              'Dr. Amogh G completed his MBBS at Bangalore Medical College and MD General Medicine at Mandya Institute of Medical Science. He is listed with 14+ years of clinical experience at Pragati Hospital, Mandya.'
          )
          assistant.write_text(text)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/booking-widget.js js/site-assistant.js
          git commit -m "[bot] Apply Dr Amogh updates"
          git push origin main

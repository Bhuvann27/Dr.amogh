name: Fix booking date picker v2

on:
  push:
    branches: [main]

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch date picker interaction
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/booking-widget.js')
          s = p.read_text()

          old_css = '''.date-picker-field{position:relative;cursor:pointer;touch-action:manipulation;}\n    .date-picker-field .date-picker-text{pointer-events:none;}\n    .date-picker-field > input[type="date"]{\n      position:absolute;\n      inset:0;\n      width:100%;\n      height:100%;\n      margin:0;\n      opacity:0;\n      cursor:pointer;\n      z-index:2;\n      -webkit-appearance:auto;\n    }'''
          new_css = '''.date-picker-field{position:relative;cursor:pointer;touch-action:manipulation;}\n    .date-picker-field .date-picker-text{pointer-events:none;}\n    .date-picker-field > input[type="date"]{\n      position:absolute;\n      inset:0;\n      width:100%;\n      height:100%;\n      margin:0;\n      opacity:0;\n      cursor:pointer;\n      z-index:1;\n      pointer-events:none;\n    }'''
          if old_css not in s:
              raise SystemExit('Expected date picker CSS block not found')
          s = s.replace(old_css, new_css, 1)

          old_desktop = '''    const input = document.getElementById("bookDateInput");\n    if(input && typeof input.showPicker === "function"){\n      input.addEventListener("pointerdown", (event) => {\n        event.preventDefault();\n        try { input.showPicker(); } catch(e) { input.focus(); }\n      }, { once:true });\n    }\n'''
          if old_desktop not in s:
              raise SystemExit('Expected desktop picker handler not found')
          s = s.replace(old_desktop, '', 1)

          old_attach = '''      if(field){\n        field.addEventListener("pointerdown", (event) => {\n          if(event.target === input) return;\n          event.preventDefault();\n          try {\n            if(typeof input.showPicker === "function") input.showPicker();\n            else input.click();\n          } catch(e) {\n            try { input.click(); } catch(_) { input.focus(); }\n          }\n        });\n      }\n'''
          new_attach = '''      if(field){\n        const openNativeDatePicker = (event) => {\n          event.preventDefault();\n          try {\n            if(typeof input.showPicker === "function") input.showPicker();\n            else input.click();\n          } catch(e) {\n            try { input.click(); } catch(_) { input.focus(); }\n          }\n        };\n        // Use the trusted click on the whole visible box. The input itself is\n        // pointer-transparent, so text, empty space and the arrow all reach here.\n        field.addEventListener("click", openNativeDatePicker);\n        field.addEventListener("keydown", (event) => {\n          if(event.key === "Enter" || event.key === " "){\n            openNativeDatePicker(event);\n          }\n        });\n      }\n'''
          if old_attach not in s:
              raise SystemExit('Expected field pointerdown handler not found')
          s = s.replace(old_attach, new_attach, 1)

          old_repeat = '''      // Re-apply the desktop picker interaction after every render of Step 1.\n      if(window.matchMedia("(min-width: 781px)").matches && typeof input.showPicker === "function"){\n        input.addEventListener("pointerdown", (event) => {\n          event.preventDefault();\n          try { input.showPicker(); } catch(e) { input.focus(); }\n        }, { once:true });\n      }\n'''
          if old_repeat not in s:
              raise SystemExit('Expected repeated desktop picker handler not found')
          s = s.replace(old_repeat, '', 1)

          p.write_text(s)
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/booking-widget.js
          git commit -m "[bot] Make entire booking date field tappable" || exit 0
          git rm .github/workflows/fix-booking-date-picker-v2.yml
          git commit -m "[bot] Remove temporary date picker workflow"
          git push

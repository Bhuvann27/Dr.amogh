name: Build high resolution hero frame sequence

on:
  push:
    paths:
      - ".github/workflows/build-hero-sequence.yml"

permissions:
  contents: write

jobs:
  build-frames:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow opencv-python-headless

      - name: Extract all source frames
        run: |
          python - <<'PY'
          import cv2
          from pathlib import Path
          from PIL import Image

          src = Path("assets/hero/dr-amogh-hero.mp4")
          out = Path("assets/hero-sequence-hires")
          import shutil
          shutil.rmtree(out, ignore_errors=True)
          out.mkdir(parents=True, exist_ok=True)

          # Start just before the first hook and keep the full coat lift-off payoff. Stop before the source fades to black.
          # Regenerate the full source range so the coat lift-off ending is present in the committed frame set.
          START_FRAME = 32
          END_FRAME = 228

          cap = cv2.VideoCapture(str(src))
          total = int(cap.get(cv2.CAP_PROP_FRAME_COUNT))
          fps = cap.get(cv2.CAP_PROP_FPS)

          if total < 2:
              raise SystemExit("Hero source video could not be read.")

          print(f"Source: {total} frames at {fps:.3f} fps")

          if START_FRAME < 1 or END_FRAME > total or START_FRAME > END_FRAME:
              raise SystemExit(f"Invalid trim: {START_FRAME}-{END_FRAME} for {total} frames.")

          # Seek through the source once and keep only the requested range.
          i = 0
          written = 0
          while True:
              ok, frame = cap.read()
              if not ok:
                  break
              source_frame = i + 1
              if START_FRAME <= source_frame <= END_FRAME:
                  rgb = cv2.cvtColor(frame, cv2.COLOR_BGR2RGB)
                  Image.fromarray(rgb).save(
                      out / f"frame_{written+1:04d}.webp",
                      format="WEBP",
                      lossless=True,
                      method=6
                  )
                  written += 1
              if source_frame >= END_FRAME:
                  break
              i += 1

          cap.release()
          expected = END_FRAME - START_FRAME + 1
          print(f"Wrote {written} trimmed frames ({START_FRAME}-{END_FRAME})")
          if written != expected:
              raise SystemExit(f"Expected {expected} trimmed frames, wrote {written}.")
          PY

      - name: Commit generated frames
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-sequence-hires
          git commit -m "Add full-resolution hero frame sequence" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
          git push origin HEAD:anise/dr-amogh-ai-upgrade --force

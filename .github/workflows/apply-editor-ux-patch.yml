name: Apply editor UX patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch into editor bundle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          editor = Path('admin/js/editor.js')
          patch = Path('admin/js/editor-ux-patch.js')
          marker = '/* ANISE_EDITOR_UX_PATCH_V1 */'
          text = editor.read_text(encoding='utf-8')
          addon = patch.read_text(encoding='utf-8').strip()
          if marker not in text:
              editor.write_text(text.rstrip() + '\n\n' + marker + '\n' + addon + '\n', encoding='utf-8')
          PY

      - name: Commit bundled patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/js/editor.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix Patient Insight workflow loading states [skip ci]"
          git push

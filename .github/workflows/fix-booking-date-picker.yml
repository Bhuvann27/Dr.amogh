name: Fix booking date picker

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply mobile date-picker fix
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$COMMIT_MESSAGE" = "[bot] Fix booking date picker" ]; then
            echo "Fix already applied. Nothing to do."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          path = Path('js/booking-widget.js')
          text = path.read_text()
          marker = '  // Desktop-only consultation refinement. Mobile keeps its existing layout and behavior untouched.\n'
          css = '''  // Make the entire existing date field a real native date-input hit area.\n  // The visual box stays unchanged; the transparent input sits over the whole box\n  // so a tap anywhere on it opens the calendar, including the text area.\n  const datePickerStyle = document.createElement("style");\n  datePickerStyle.id = "booking-date-picker-tap-fix";\n  datePickerStyle.textContent = `\n    .date-picker-field{position:relative;cursor:pointer;touch-action:manipulation;}\n    .date-picker-field .date-picker-text{pointer-events:none;}\n    .date-picker-field > input[type="date"]{\n      position:absolute;\n      inset:0;\n      width:100%;\n      height:100%;\n      margin:0;\n      opacity:0;\n      cursor:pointer;\n      z-index:2;\n      -webkit-appearance:auto;\n    }\n  `;\n  document.head.appendChild(datePickerStyle);\n\n'''
          if 'booking-date-picker-tap-fix' not in text:
              if marker not in text:
                  raise SystemExit('Expected booking widget marker was not found')
              text = text.replace(marker, css + marker, 1)
          path.write_text(text)
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-booking-date-picker.yml
          git add js/booking-widget.js
          git commit -m "[bot] Fix booking date picker"
          git push origin main

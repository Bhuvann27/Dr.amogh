name: Temporary phone prefix refinement

on:
  push:
    branches:
      - anise/patient-insight-improve

permissions:
  contents: write

jobs:
  refine:
    if: github.event.head_commit.message != 'Refine desktop phone prefix separation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: anise/patient-insight-improve
      - name: Apply desktop-only phone prefix separator
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/booking-widget.js')
          s = p.read_text()
          old = '''      #consult .booking-widget .date-picker-hint{\n        margin-top:10px;\n        margin-bottom:0;\n      }'''
          new = '''      #consult .booking-widget .date-picker-hint{\n        margin-top:10px;\n        margin-bottom:0;\n      }\n      #consult .booking-widget .phone-input-wrap{\n        display:flex;\n        align-items:stretch;\n      }\n      #consult .booking-widget .phone-prefix{\n        display:inline-flex;\n        align-items:center;\n        flex:0 0 auto;\n        padding:0 14px 0 4px;\n        margin-right:14px;\n        border-right:1px solid var(--line);\n        color:var(--text-dim);\n      }\n      #consult .booking-widget .phone-input-wrap .field-input{\n        flex:1 1 auto;\n        min-width:0;\n      }'''
          if old not in s:
              raise SystemExit('Target desktop consultation CSS block not found')
          if '.phone-prefix{' in s:
              raise SystemExit('Phone prefix refinement already present')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/booking-widget.js
          git commit -m "Refine desktop phone prefix separation"
          git push origin anise/patient-insight-improve

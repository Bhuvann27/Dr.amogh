name: Fix Patient Insight editor freeze

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove recursive UX patch and apply safe workflow UX
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin/js/editor.js')
          text = p.read_text(encoding='utf-8')
          marker = '/* ANISE_EDITOR_UX_PATCH_V1 */'
          if marker in text:
              text = text.split(marker, 1)[0].rstrip() + '\n'

          old_css = '.pi-status.error{color:#a22b18}.pi-status.success{color:#28724a}'
          new_css = old_css + '.pi-status.busy{display:flex;align-items:center;gap:9px}.pi-status.busy:before{content:"";width:13px;height:13px;border:2px solid rgba(23,19,15,.14);border-top-color:var(--orange-deep);border-radius:50%;animation:piStatusSpin .75s linear infinite;flex:0 0 auto}@keyframes piStatusSpin{to{transform:rotate(360deg)}}.pi-step-note{margin:7px 0 0;color:var(--text-dim);font-size:.82rem;line-height:1.5}.pi-processing{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px 14px;border-radius:14px;background:#f7f4ef;border:1px solid rgba(23,19,15,.08);color:#3e3934;font-size:.88rem;line-height:1.45}.pi-processing[hidden]{display:none!important}.pi-processing.error{color:#a22b18}.pi-spinner{width:16px;height:16px;border:2px solid rgba(23,19,15,.16);border-top-color:var(--orange-deep);border-radius:50%;animation:piStatusSpin .75s linear infinite;flex:0 0 auto}'
          if old_css in text and 'piStatusSpin' not in text:
              text = text.replace(old_css, new_css, 1)

          old_step2 = '<div id="piQuestionBox" class="pi-question"></div><div class="pi-intake" style="margin-top:16px">'
          new_step2 = '<div id="piQuestionBox" class="pi-question"></div><p class="pi-step-note">A short answer in your own words is enough. If you are unsure, you can skip this detail.</p><div class="pi-intake" style="margin-top:16px">'
          text = text.replace(old_step2, new_step2, 1)

          old_actions = '<div class="pi-actions"><button class="pi-btn pi-btn-dark" id="piAnswerBtn" type="button">Continue</button><button class="pi-btn pi-btn-light" id="piSkipBtn" type="button">Skip this detail</button></div><div class="pi-conversation" id="piConversation"></div>'
          new_actions = '<div class="pi-actions"><button class="pi-btn pi-btn-dark" id="piAnswerBtn" type="button">Continue</button><button class="pi-btn pi-btn-light" id="piSkipBtn" type="button">Skip this detail</button></div><div class="pi-processing" id="piStep2Processing" hidden><span class="pi-spinner" aria-hidden="true"></span><span><strong>Creating the patient-friendly story…</strong><br><span>Turning the clarified case into a draft. Nothing is published automatically.</span></span></div><div class="pi-conversation" id="piConversation"></div>'
          text = text.replace(old_actions, new_actions, 1)

          text = text.replace('<span class="pi-kicker">STEP 3 · AI DRAFT</span><h2>Your story is ready to review.</h2><p class="pi-help">Read it carefully. Nothing is published automatically.</p>', '<span class="pi-kicker">STEP 3 · DOCTOR REVIEW</span><h2>Your story is ready to review.</h2><p class="pi-help">Review the draft carefully. Nothing is published until you approve it.</p>', 1)

          old_generate = '  async function generateDraft(regenerate){try{status(regenerate?"Regenerating the story…":"Writing the patient-friendly story…","busy");const notes=rawNotes+"\\n\\nClarifications:\\n"+transcript.filter(x=>x.role==="doctor").map(x=>x.content).join("\\n");const d=await callAI({mode:"draft",notes,conversation:transcript,regenerate:!!regenerate});renderDraft(d);document.getElementById("piConversationCard").hidden=true;document.getElementById("piDraftCard").hidden=false;status("Draft ready. Nothing is published until you approve it.","success")}catch(e){status(e.message,"error")}}'
          new_generate = '''  async function generateDraft(regenerate){
    const c=document.getElementById("piConversationCard"),b=document.getElementById("piAnswerBtn"),loader=document.getElementById("piStep2Processing"),fromStep2=!c.hidden;
    if(fromStep2){b.disabled=true;loader.hidden=false;loader.classList.remove("error");}
    else status(regenerate?"Regenerating the story…":"Writing the patient-friendly story…","busy");
    try{
      const notes=rawNotes+"\\n\\nClarifications:\\n"+transcript.filter(x=>x.role==="doctor").map(x=>x.content).join("\\n");
      const d=await callAI({mode:"draft",notes,conversation:transcript,regenerate:!!regenerate});
      renderDraft(d);
      c.hidden=true;
      document.getElementById("piDraftCard").hidden=false;
      if(!fromStep2)status("Draft ready. Nothing is published until you approve it.","success");
    }catch(e){
      if(fromStep2){loader.classList.add("error");loader.innerHTML='<span>⚠</span><span><strong>Could not create the story.</strong><br><span>'+esc(e.message||"Please try again.")+'</span></span>';}
      else status(e.message,"error");
    }finally{
      if(fromStep2)b.disabled=false;
    }
  }'''
          if old_generate not in text:
              raise SystemExit('generateDraft target not found; refusing partial patch')
          text = text.replace(old_generate, new_generate, 1)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit fixed editor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/js/editor.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix Patient Insight editor freeze [skip ci]"
          git push

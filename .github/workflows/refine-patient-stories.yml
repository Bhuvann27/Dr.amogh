name: Refine patient stories experience

on:
  push:
    paths:
      - '.github/workflows/refine-patient-stories.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Apply patient stories redesign
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          # ----- stories.html: scalable chooser + clinic placement -----
          p = root / 'stories.html'
          s = p.read_text()
          old = '<nav class="story-pills reveal" id="storyPills" aria-label="Choose a patient story"></nav>'
          new = '''<div class="story-library reveal" id="storyLibrary">
              <div class="story-library-top">
                <div>
                  <span class="story-library-label">STORY LIBRARY</span>
                  <strong id="storyCountLabel">Stories from this practice</strong>
                </div>
                <label class="story-search"><span class="sr-only">Search patient stories</span><input id="storySearch" type="search" placeholder="Search stories" autocomplete="off"></label>
              </div>
              <div class="story-category-row" id="storyCategories" aria-label="Filter patient stories"></div>
              <nav class="story-pills" id="storyPills" aria-label="Choose a patient story"></nav>
            </div>'''
          if old not in s:
              raise SystemExit('story chooser marker not found')
          s = s.replace(old, new)
          s = s.replace('Two separate patient experiences. Step into one conversation and follow what unfolded, one exchange at a time.', 'Explore the patient stories from this practice. Filter by topic, search by title, and open one conversation at a time.')
          s = s.replace('A simple conversation. Scroll to follow what happened, one exchange at a time.', 'One exchange at a time. Swipe or use the controls to continue.')
          clinic = '''<section class="section-pad" style="text-align:center;">
            <div class="container">
              <p class="reveal" style="font-family:var(--font-display); font-weight:700; letter-spacing:-0.01em; font-size:clamp(1.15rem,2.4vw,1.4rem); max-width:36ch; margin:0 auto;">
                If this sounds familiar, Dr. Amogh is at Pragati Hospital, Mandya.
              </p>
              <p class="reveal" style="margin-top:14px;"><a href="index.html#visit" style="font-weight:600; color:var(--text-dim); border-bottom:1px solid var(--line);">View clinic details &rarr;</a></p>
            </div>
          </section>'''
          if clinic not in s:
              raise SystemExit('clinic section marker not found')
          s = s.replace(clinic, '')
          marker = '<section class="section-pad other-stories">'
          if marker not in s:
              raise SystemExit('more stories marker not found')
          s = s.replace(marker, clinic + '\n\n' + marker, 1)
          p.write_text(s)

          # ----- stories.js: swipeable conversation + scalable story library -----
          stories_js = r'''(function(){
            "use strict";

            async function loadStories(){
              const local = window.PATIENT_STORIES || [];
              if(!window.PatientInsightsDB) return local;
              try{
                const remote = await Promise.race([
                  window.PatientInsightsDB.fetchPublished(),
                  new Promise(resolve => setTimeout(() => resolve([]), 2500))
                ]);
                if(!remote.length) return local;
                const bySlug = new Map(local.map(s => [s.slug, s]));
                remote.forEach(s => bySlug.set(s.slug, s));
                return Array.from(bySlug.values());
              }catch(e){ return local; }
            }

            function esc(value){
              return String(value ?? "").replace(/[&<>"']/g, ch => ({
                "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
              }[ch]));
            }

            function inferCategory(story){
              const raw = String(story.category || story.topic || story.subtitle || story.title || "").toLowerCase();
              if(/pregnan|pregnancy|antenatal|postpartum|women/.test(raw)) return "Women's health";
              if(/headache|dizziness|migraine|sleep|stress|fatigue|tired/.test(raw)) return "Everyday symptoms";
              if(/diabet|sugar|blood pressure|hypertension|cholesterol|metabolic/.test(raw)) return "Long-term health";
              if(/infection|fever|cough|cold|viral|respirat/.test(raw)) return "Infections";
              if(/digest|gastric|stomach|meal|acid|bowel/.test(raw)) return "Digestive health";
              return "General medicine";
            }

            function categoryFor(story){ return String(story.category || story.topic || inferCategory(story)).trim() || "General medicine"; }

            loadStories().then(init);

            function init(stories){
              if(!stories.length) return;
              const params = new URLSearchParams(window.location.search);
              const requested = params.get("story");
              const story = stories.find(s => s.slug === requested) || stories[0];
              const storyIndex = Math.max(0, stories.indexOf(story));

              const year = document.getElementById("year");
              if(year) year.textContent = new Date().getFullYear();
              document.title = String(story.title || "Patient Story").replace(/[“”]/g, "") + " — Dr. Amogh G";

              const storyEyebrow = document.getElementById("selectedStoryLabel");
              const storyTitle = document.getElementById("storyTitle");
              const storyIntro = document.getElementById("storyIntro");
              if(storyEyebrow) storyEyebrow.textContent = "PATIENT STORY " + String(storyIndex + 1).padStart(2,"0");
              if(storyTitle) storyTitle.textContent = story.title || "Patient story";
              if(storyIntro) storyIntro.textContent = story.intro || "A patient conversation from this practice.";

              buildLibrary(stories, story);
              buildConversation(story);

              const relateIntro = document.getElementById("relateIntro");
              const relateClose = document.getElementById("relateClose");
              if(relateIntro) relateIntro.textContent = story.relateIntro || "Sometimes small changes are easy to ignore. You may have noticed that:";
              if(relateClose) relateClose.textContent = story.relateClose || "When something keeps happening or starts affecting everyday life, it is worth paying attention to.";

              const relateList = document.getElementById("relateList");
              if(relateList){
                relateList.innerHTML = "";
                (story.relatePoints || []).forEach(point => {
                  const li = document.createElement("li");
                  li.innerHTML = '<span class="dot"></span><span>' + esc(point) + '</span>';
                  relateList.appendChild(li);
                });
              }

              const actionList = document.getElementById("actionList");
              if(actionList){
                actionList.innerHTML = "";
                (story.actionPoints || []).forEach(point => {
                  const li = document.createElement("li");
                  li.textContent = point;
                  actionList.appendChild(li);
                });
              }
              const urgent = document.getElementById("urgentText");
              if(urgent) urgent.textContent = story.urgent || "If symptoms are sudden, severe, or getting worse, seek medical attention promptly.";

              buildOtherStories(stories, story);
              setupReveals();
            }

            function buildLibrary(stories, selected){
              const wrap = document.getElementById("storyPills");
              const categoriesWrap = document.getElementById("storyCategories");
              const search = document.getElementById("storySearch");
              const count = document.getElementById("storyCountLabel");
              if(!wrap) return;

              const categories = ["All", ...Array.from(new Set(stories.map(categoryFor)))];
              let activeCategory = "All";
              let query = "";

              function render(){
                const filtered = stories.filter(s => {
                  const categoryMatch = activeCategory === "All" || categoryFor(s) === activeCategory;
                  const haystack = [s.title,s.subtitle,s.intro,s.topic,categoryFor(s)].join(" ").toLowerCase();
                  return categoryMatch && (!query || haystack.includes(query));
                });
                wrap.innerHTML = "";
                filtered.forEach(s => {
                  const i = stories.indexOf(s);
                  const a = document.createElement("a");
                  a.href = "stories.html?story=" + encodeURIComponent(s.slug);
                  a.className = "story-choice" + (s.slug === selected.slug ? " is-selected" : "");
                  if(s.slug === selected.slug) a.setAttribute("aria-current","true");
                  a.innerHTML =
                    '<span class="story-choice-num">' + String(i+1).padStart(2,"0") + '</span>' +
                    '<span class="story-choice-copy"><strong>' + esc(categoryFor(s)) + '</strong><span>' + esc(String(s.title || "").replace(/[“”]/g,"")) + '</span></span>' +
                    '<span class="story-choice-arrow" aria-hidden="true">↗</span>';
                  wrap.appendChild(a);
                });
                if(count) count.textContent = filtered.length + (filtered.length === 1 ? " story" : " stories");
                if(!filtered.length) wrap.innerHTML = '<p class="story-empty">No stories match that filter yet.</p>';
              }

              if(categoriesWrap){
                categoriesWrap.innerHTML = "";
                categories.forEach(category => {
                  const b = document.createElement("button");
                  b.type = "button";
                  b.className = "story-category" + (category === activeCategory ? " is-active" : "");
                  b.textContent = category;
                  b.setAttribute("aria-pressed", category === activeCategory ? "true" : "false");
                  b.onclick = () => {
                    activeCategory = category;
                    categoriesWrap.querySelectorAll(".story-category").forEach(x => {
                      const active = x.textContent === activeCategory;
                      x.classList.toggle("is-active", active);
                      x.setAttribute("aria-pressed", active ? "true" : "false");
                    });
                    render();
                  };
                  categoriesWrap.appendChild(b);
                });
              }
              if(search) search.oninput = () => { query = search.value.trim().toLowerCase(); render(); };
              render();
            }

            function buildConversation(story){
              const track = document.getElementById("convTrack");
              const stage = document.getElementById("convStage");
              const wrap = document.getElementById("convPairs");
              const counter = document.getElementById("convCounter");
              const progress = document.getElementById("convProgressNum");
              if(!track || !stage || !wrap) return;

              const pairs = Array.isArray(story.dialogue) ? story.dialogue : [];
              wrap.innerHTML = "";
              if(counter) counter.innerHTML = "";

              const viewport = document.createElement("div");
              viewport.className = "conv-carousel-viewport";
              const carousel = document.createElement("div");
              carousel.className = "conv-carousel";
              wrap.appendChild(viewport);
              viewport.appendChild(carousel);

              const slides = pairs.map((pair,i) => {
                const el = document.createElement("article");
                el.className = "conv-pair" + (i === 0 ? " is-active" : "");
                el.innerHTML = '<span class="conv-speaker">PATIENT ↔ DOCTOR · ' + String(i+1).padStart(2,"0") + '</span><p class="q">' + esc(pair.q) + '</p><p class="a">' + esc(pair.a) + '</p>';
                carousel.appendChild(el);
                return el;
              });

              if(!slides.length){
                const el=document.createElement("article");
                el.className="conv-pair is-active";
                el.innerHTML='<span class="conv-speaker">PATIENT ↔ DOCTOR</span><p class="a">This story is being prepared.</p>';
                carousel.appendChild(el);
                slides.push(el);
              }

              slides.forEach((_,i)=>{
                const dot=document.createElement("i");
                dot.className=""+(i===0?"active":"");
                if(counter) counter.appendChild(dot);
              });

              const controls = document.createElement("div");
              controls.className="conv-controls";
              controls.innerHTML='<button type="button" class="conv-nav conv-prev" aria-label="Previous exchange">←</button><span class="conv-swipe-hint">Swipe to continue</span><button type="button" class="conv-nav conv-next" aria-label="Next exchange">→</button>';
              stage.appendChild(controls);

              let active=0;
              const total=slides.length;
              function render(next, focus=false){
                active=Math.max(0,Math.min(total-1,next));
                carousel.style.transform='translate3d(' + (-active*100) + '%,0,0)';
                slides.forEach((el,i)=>el.classList.toggle("is-active",i===active));
                if(progress) progress.textContent=String(active+1).padStart(2,"0")+' / '+String(total).padStart(2,"0");
                if(counter) Array.from(counter.children).forEach((d,i)=>d.classList.toggle("active",i===active));
                controls.querySelector('.conv-prev').disabled=active===0;
                controls.querySelector('.conv-next').disabled=active===total-1;
                if(focus) stage.focus({preventScroll:true});
              }
              controls.querySelector('.conv-prev').onclick=()=>render(active-1,true);
              controls.querySelector('.conv-next').onclick=()=>render(active+1,true);

              let startX=0,startY=0,dragging=false;
              viewport.addEventListener('touchstart',e=>{
                const t=e.changedTouches[0]; startX=t.clientX; startY=t.clientY; dragging=true;
              },{passive:true});
              viewport.addEventListener('touchend',e=>{
                if(!dragging)return; dragging=false;
                const t=e.changedTouches[0], dx=t.clientX-startX, dy=t.clientY-startY;
                if(Math.abs(dx)>48 && Math.abs(dx)>Math.abs(dy)*1.2) render(active+(dx<0?1:-1));
              },{passive:true});
              viewport.addEventListener('pointerdown',e=>{
                if(e.pointerType==='touch')return;
                startX=e.clientX; startY=e.clientY; dragging=true;
              });
              viewport.addEventListener('pointerup',e=>{
                if(!dragging || e.pointerType==='touch')return; dragging=false;
                const dx=e.clientX-startX,dy=e.clientY-startY;
                if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.2) render(active+(dx<0?1:-1));
              });
              stage.tabIndex=0;
              stage.addEventListener('keydown',e=>{
                if(e.key==='ArrowRight') {e.preventDefault();render(active+1);}
                if(e.key==='ArrowLeft') {e.preventDefault();render(active-1);}
              });
              render(0);
            }

            function buildOtherStories(stories, selected){
              const wrap=document.getElementById("otherStories");
              if(!wrap)return;
              wrap.innerHTML="";
              const others=stories.filter(s=>s.slug!==selected.slug).slice(0,6);
              if(!others.length){wrap.parentElement.parentElement.style.display="none";return;}
              others.forEach(s=>{
                const i=stories.indexOf(s);
                const a=document.createElement("a");
                a.href="stories.html?story="+encodeURIComponent(s.slug);
                a.className="other-story-card";
                a.innerHTML='<span class="other-story-number">PATIENT STORY '+String(i+1).padStart(2,"0")+'</span><p class="quote">'+esc(s.title||"")+'</p><p class="meta">'+esc(s.subtitle||categoryFor(s))+'</p><span class="other-story-read">READ THIS STORY ↗</span>';
                wrap.appendChild(a);
              });
            }

            function setupReveals(){
              const revealEls=document.querySelectorAll(".reveal");
              if("IntersectionObserver" in window){
                const io=new IntersectionObserver(entries=>entries.forEach(entry=>{
                  if(entry.isIntersecting){entry.target.classList.add("is-visible");io.unobserve(entry.target);}
                }),{threshold:.15});
                revealEls.forEach(el=>io.observe(el));
              }else revealEls.forEach(el=>el.classList.add("is-visible"));
            }
          })();
          '''
          (root / 'js/stories.js').write_text(stories_js)

          # ----- stories.css: replace the dark pinned-scroll feel with a warm continuous swipe section -----
          css = root / 'css/stories.css'
          existing = css.read_text()
          marker = '/* ANISE PATIENT STORIES SWIPE REDESIGN */'
          if marker not in existing:
              existing += r'''

/* ANISE PATIENT STORIES SWIPE REDESIGN */
.story-library{margin-top:30px;padding:22px;border:1px solid var(--line);border-radius:20px;background:var(--stone);}
.story-library-top{display:flex;align-items:center;justify-content:space-between;gap:18px;}
.story-library-label{display:block;font-size:.64rem;font-weight:800;letter-spacing:.14em;color:var(--orange-deep);margin-bottom:5px;}
.story-library-top strong{font-family:var(--font-display);font-size:1rem;}
.story-search input{width:min(260px,45vw);height:42px;border:1px solid rgba(23,19,15,.14);border-radius:999px;padding:0 15px;background:var(--paper);font:inherit;box-sizing:border-box;}
.story-search input:focus{outline:2px solid rgba(242,84,12,.18);border-color:var(--orange);}
.story-category-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;}
.story-category{border:1px solid rgba(23,19,15,.13);background:var(--paper);color:var(--text-dim);border-radius:999px;padding:8px 13px;font:inherit;font-size:.76rem;font-weight:700;cursor:pointer;transition:.2s ease;}
.story-category:hover,.story-category.is-active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.story-pills{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px!important;margin-top:18px!important;padding-top:0!important;border-top:0!important;}
.story-pills::before{display:none!important;}
.story-choice{min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px 15px;border:1px solid rgba(23,19,15,.11);border-radius:15px;background:var(--paper);color:var(--ink);transition:transform .25s ease,border-color .2s ease,background .2s ease;}
.story-choice:hover{transform:translateY(-2px);border-color:var(--orange);}
.story-choice[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.story-choice-num{font-family:var(--font-display);font-weight:800;font-size:.9rem;color:var(--orange-deep);}
.story-choice[aria-current="true"] .story-choice-num{color:var(--paper);}
.story-choice-copy{min-width:0;display:grid;gap:3px;}
.story-choice-copy strong{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);}
.story-choice[aria-current="true"] .story-choice-copy strong{color:rgba(251,249,244,.58);}
.story-choice-copy>span{font-weight:750;line-height:1.25;}
.story-choice-arrow{font-size:1rem;opacity:.55;}
.story-empty{grid-column:1/-1;margin:0;padding:18px;color:var(--text-dim);}

.conv-track{background:var(--stone)!important;border-top:1px solid var(--line)!important;border-bottom:1px solid var(--line)!important;overflow:hidden;}
.conv-stage{position:relative!important;top:auto!important;height:auto!important;min-height:0!important;padding:clamp(58px,8vw,92px) var(--pad) clamp(62px,8vw,88px)!important;display:block!important;overflow:visible!important;outline:none;}
.conv-stage::before{background:radial-gradient(80% 80% at 50% 45%,rgba(242,84,12,.07),transparent 68%)!important;}
.conv-stage::after{display:none!important;}
.conv-stage #convPairs{position:relative!important;inset:auto!important;width:min(100%,900px);margin:0 auto;}
.conv-carousel-viewport{overflow:hidden;border:1px solid rgba(23,19,15,.11);border-radius:26px;background:var(--paper);box-shadow:0 14px 38px rgba(23,19,15,.06);touch-action:pan-y;}
.conv-carousel{display:flex;transition:transform .42s cubic-bezier(.22,.61,.36,1);will-change:transform;}
.conv-pair{position:relative!important;top:auto!important;left:auto!important;transform:none!important;opacity:1!important;visibility:visible!important;flex:0 0 100%;width:100%;min-height:clamp(430px,58vh,570px);box-sizing:border-box;padding:clamp(48px,7vw,78px) clamp(24px,7vw,90px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--ink)!important;}
.conv-pair .conv-speaker{display:block;font-size:.64rem;font-weight:800;letter-spacing:.13em;color:var(--orange-deep);margin-bottom:26px;}
.conv-pair .q{font-size:.8rem!important;letter-spacing:.08em!important;text-transform:uppercase;color:var(--text-dim)!important;margin:0 0 14px!important;}
.conv-pair .q::before,.conv-pair .q::after{display:none;}
.conv-pair .a{font-size:clamp(1.25rem,3vw,1.9rem)!important;line-height:1.38!important;max-width:30ch;margin:0!important;color:var(--ink)!important;}
.conv-progress-num{position:static!important;transform:none!important;text-align:center;margin-top:20px;font-size:.78rem;color:var(--text-dim)!important;}
.conv-counter{position:static!important;transform:none!important;display:flex;justify-content:center;margin-top:11px;gap:7px;}
.conv-counter i{background:rgba(23,19,15,.18)!important;width:6px;height:6px;}
.conv-counter i.active{background:var(--orange)!important;}
.conv-controls{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:18px;}
.conv-nav{width:42px;height:42px;border-radius:50%;border:1px solid rgba(23,19,15,.16);background:var(--paper);color:var(--ink);font:inherit;font-size:1.05rem;cursor:pointer;}
.conv-nav:hover:not(:disabled){border-color:var(--orange);}
.conv-nav:disabled{opacity:.35;cursor:default;}
.conv-swipe-hint{font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);}

.relate-section{background:var(--paper)!important;border-top:1px solid var(--line);}
.action-panel{background:var(--paper)!important;}
.other-stories{background:var(--stone)!important;border-top:1px solid var(--line)!important;}
.other-story-grid{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))!important;max-width:none!important;}
.other-story-card{min-height:230px!important;}

@media(max-width:760px){
  .story-library{padding:16px;border-radius:17px;}
  .story-library-top{align-items:flex-start;flex-direction:column;}
  .story-search,.story-search input{width:100%;}
  .story-search input{width:100%;}
  .story-pills{grid-template-columns:1fr!important;}
  .story-choice{padding:13px 12px;}
  .conv-stage{padding-left:14px!important;padding-right:14px!important;}
  .conv-pair{min-height:430px;padding:42px 22px;}
  .conv-carousel-viewport{border-radius:20px;}
  .conv-swipe-hint{font-size:.6rem;}
}

@media(prefers-reduced-motion:reduce){
  .conv-carousel{transition:none;}
  .story-choice{transition:none;}
}
'''
          css.write_text(existing)

          # ----- static fallback stories get explicit categories -----
          data = root / 'js/stories-data.js'
          ds = data.read_text()
          ds = ds.replace('slug: "fatigue",\n', 'slug: "fatigue",\n    category: "Everyday symptoms",\n', 1)
          ds = ds.replace('slug: "headache",\n', 'slug: "headache",\n    category: "Everyday symptoms",\n', 1)
          data.write_text(ds)

          # ----- AI generation prompt: practical prevention, early recognition, waiting-period guidance -----
          edge = root / 'supabase/functions/patient-insight-ai/index.ts'
          edge.write_text(r'''import 'jsr:@supabase/functions-js/edge-runtime.d.ts'

const cors={"Access-Control-Allow-Origin":"*","Access-Control-Allow-Headers":"authorization, x-client-info, apikey, content-type","Access-Control-Allow-Methods":"POST, OPTIONS","Content-Type":"application/json"}
const json=(d:unknown,s=200)=>new Response(JSON.stringify(d),{status:s,headers:cors})
const key=()=>Deno.env.get('GEMINI_API_KEY')||Deno.env.get('GOOGLE_API_KEY')||''
const MODELS=['gemini-3.5-flash','gemini-3.5-flash-lite']
function prompt(mode:string,notes:string,conversation:unknown[],count=0,regen=false){
  const ctx=JSON.stringify({notes,conversation,questionCount:count,regenerate:regen})
  if(mode==='analyze') return `You are the clinical-story assistant for a General Medicine doctor's private Patient Insight editor. Do not diagnose or write the public story yet. Extract only facts supplied. Never invent symptoms, tests, diagnoses, treatment, outcomes, emotions, quotes or identifying information. Decide if enough narrative information exists. Ask ONE concrete follow-up question only when genuinely useful, never vague questions. Ask no more than 4 follow-ups. Return only JSON: {"status":"needs_more"|"ready","question":"","question_reason":"","known":{"patient_context":"","main_concern":"","timeline":"","progression_pattern":"","associated_features":"","previous_evaluation":"","previous_treatment":"","impact_on_life":"","doctor_observation":""}}. If ready, question fields are empty.\n\nDOCTOR INPUT:\n${ctx}`
  return `Create a warm, specific, clinically responsible patient-facing Patient Insight from private doctor notes. Make a reader recognise a similar lived experience, not a disease advertisement. Use only supplied information. Never invent facts, quotes, tests, diagnoses, medicines, improvement, recovery, emotions or outcomes. Make it feel like an HPI translated into human language. Dialogue answers are paraphrases, not invented quotations.

The "actionPoints" field is a patient-education section called "What you can do". It must be about practical actions the reader can take BEFORE seeing a doctor or WHILE arranging/awaiting care. Focus on prevention, sensible day-to-day habits relevant to the supplied story, early recognition of warning changes, useful things to track or avoid, and safe precautions while waiting to reach a doctor. Do NOT use this field for diagnosis, investigations, treatment plans, prescriptions, medication changes, procedures, what the doctor will do, or what happens after the patient reaches the clinic. Do not tell a patient to start/stop a medicine unless that exact instruction is explicitly supplied and clearly appropriate for the story. Keep the advice conservative and specific to the supplied facts, not generic wellness filler. If there is not enough information for a safe practical action, use a simple monitoring or safety step rather than inventing one.

The "urgent" field should contain concise red-flag guidance based only on the supplied case. Do not invent emergency symptoms that are unrelated to the story.


    lastStatus=r.status;lastMessage=d?.error?.message||`HTTP ${r.status}`;console.error('Gemini failure',m,lastStatus,lastMessage)
    if(/api key|api_key|permission|unauthenticated|invalid/i.test(lastMessage))throw Error('Gemini authentication failed. Check GEMINI_API_KEY in Supabase Edge Function secrets.')
    if(r.status!==429&&r.status!==503&&r.status!==404)break
  }
  if(/quota|rate limit|resource exhausted|429/i.test(lastMessage))throw Error('Gemini free-tier quota/rate limit reached. Please try again later.')
  if(lastStatus===503)throw Error('Gemini is temporarily busy. The free-tier backup model was also unavailable. Please try again in a moment.')
  if(lastStatus===404)throw Error('The configured Gemini models are unavailable for this API key.')
  throw Error(`Gemini request failed (${lastStatus}): ${lastMessage}`)
}

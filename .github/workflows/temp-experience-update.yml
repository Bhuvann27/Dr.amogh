name: One-time experience update

on:
  push:
    branches:
      - anise/patient-insight-improve

permissions:
  contents: write

jobs:
  update-experience:
    if: "!contains(github.event.head_commit.message, 'Update experience to 14 years')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update only experience text
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = {
              '12+ years of experience': '14+ years of experience',
              '12+ YEARS OF EXPERIENCE': '14+ YEARS OF EXPERIENCE',
              'more than 12 years of clinical experience': 'more than 14 years of clinical experience',
              '12+ years</strong>': '14+ years</strong>',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit only the requested change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'Update experience to 14 years'
          git push
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/temp-experience-update.yml
          git add .github/workflows/temp-experience-update.yml
          git commit -m 'Remove temporary experience update workflow'
          git push

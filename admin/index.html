<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patient Insights — Admin</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

  <div class="admin-topbar">
    <div class="wordmark">Dr. Amogh G <span>&middot;</span> Admin</div>
    <nav>
      <a href="../index.html" target="_blank" rel="noopener">View site</a>
      <button id="logoutBtn" type="button">Log out</button>
    </nav>
  </div>
  <div class="admin-tabs">
    <a href="index.html" class="active">Patient Insights</a>
    <a href="appointments.html">Appointments</a>
    <a href="availability.html">Consultation Availability</a>
  </div>

  <div class="admin-shell">
    <div class="admin-hero">
      <h1>Patient Insights</h1>
      <p>Share real patient experiences in a simple, human way.</p>
      <div class="admin-stats" id="adminStats"></div>
    </div>

    <div class="admin-toolbar">
      <div class="admin-filters" id="filters">
        <button class="admin-filter-pill active" data-filter="all">All</button>
        <button class="admin-filter-pill" data-filter="published">Published</button>
        <button class="admin-filter-pill" data-filter="draft">Drafts</button>
        <button class="admin-filter-pill" data-filter="archived">Archived</button>
      </div>
      <div style="display:flex; gap:12px; flex:1; justify-content:flex-end; flex-wrap:wrap;">
        <input class="admin-search" id="searchInput" type="search" placeholder="Search stories&hellip;">
        <button class="btn-add" id="addBtn" type="button">+ Add Patient Insight</button>
      </div>
    </div>

    <div id="listWrap">
      <p style="color:var(--text-dim);">Loading&hellip;</p>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/patient-insights-db.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>

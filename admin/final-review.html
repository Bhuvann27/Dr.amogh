<style>
.fr-wrap{max-width:1180px;margin:0 auto 80px}.fr-hero{padding:12px 0 28px}.fr-kicker{font-size:.68rem;font-weight:800;letter-spacing:.14em;color:var(--orange-deep);text-transform:uppercase}.fr-hero h1{font-size:clamp(2rem,4vw,3.2rem);letter-spacing:-.04em;margin:8px 0}.fr-hero p{max-width:760px;color:var(--text-dim);line-height:1.65;margin:0}.fr-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);gap:22px;align-items:start}.fr-card{background:#fff;border:1px solid rgba(23,19,15,.1);border-radius:24px;padding:clamp(20px,3vw,32px);box-shadow:0 12px 40px rgba(23,19,15,.06);margin-top:18px}.fr-card h2{margin:0 0 8px;font-size:1.35rem}.fr-help{color:var(--text-dim);line-height:1.55;font-size:.9rem;margin:0 0 20px}.fr-field{margin:0 0 16px}.fr-field label{display:block;font-weight:750;font-size:.82rem;margin-bottom:7px}.fr-field input,.fr-field textarea{width:100%;box-sizing:border-box;border:1px solid rgba(23,19,15,.14);border-radius:14px;padding:12px 14px;font:inherit;background:#fbfaf7}.fr-field textarea{min-height:92px;resize:vertical;line-height:1.55}.fr-pair{border:1px solid rgba(23,19,15,.1);border-radius:18px;padding:15px;margin:12px 0;background:#fbfaf7}.fr-pair-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.fr-pair-head strong{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}.fr-remove{border:0;background:transparent;color:#a22b18;cursor:pointer;font-weight:700}.fr-add{border:1px dashed rgba(23,19,15,.22);background:transparent;border-radius:999px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}.fr-ai{background:#17130f;color:#fff;border-radius:22px;padding:22px;margin-top:18px}.fr-ai p{color:rgba(255,255,255,.7);font-size:.88rem;line-height:1.55}.fr-ai textarea{width:100%;min-height:105px;box-sizing:border-box;border:1px solid rgba(255,255,255,.15);border-radius:14px;background:#24201c;color:#fff;padding:13px;font:inherit;resize:vertical}.fr-preview{position:sticky;top:18px;background:#0d0b09;color:#fbf9f4;border-radius:24px;padding:24px;max-height:calc(100vh - 36px);overflow:auto}.fr-preview h2{margin:0 0 7px}.fr-preview .muted{color:rgba(251,249,244,.58);line-height:1.55}.fr-preview .pv-title{font-size:1.8rem;line-height:1.08;margin:18px 0 10px}.fr-preview .pv-intro{line-height:1.6;color:rgba(251,249,244,.78)}.pv-block{margin-top:24px;padding-top:20px;border-top:1px solid rgba(251,249,244,.1)}.pv-block h3{font-size:.7rem;letter-spacing:.13em;text-transform:uppercase;color:#ffd9c5}.pv-turn{padding:12px 0;border-bottom:1px solid rgba(251,249,244,.08)}.pv-turn b{display:block;font-size:.68rem;letter-spacing:.08em;color:rgba(251,249,244,.45);margin-bottom:4px}.pv-turn p{margin:0;line-height:1.5}.pv-list{padding-left:20px;color:rgba(251,249,244,.8);line-height:1.6}.fr-checks label{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-bottom:1px solid rgba(23,19,15,.08);line-height:1.45}.fr-checks input{margin-top:4px}.fr-status{min-height:24px;margin-top:12px;font-size:.9rem}.fr-status.error{color:#a22b18}.fr-status.success{color:#28724a}.fr-actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:20px}.fr-publish{background:var(--orange-deep);color:#fff;border:0;border-radius:999px;padding:13px 20px;font:inherit;font-weight:800;cursor:pointer}.fr-publish:disabled{opacity:.4;cursor:not-allowed}.fr-save{background:#17130f;color:#fff;border:0;border-radius:999px;padding:13px 20px;font:inherit;font-weight:800;cursor:pointer}.fr-note{font-size:.78rem;color:var(--text-dim);line-height:1.5;margin-top:12px}.fr-badge{display:inline-flex;padding:6px 10px;border-radius:999px;background:#f1eee8;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.fr-danger{color:#a22b18;font-weight:700}.fr-loading{padding:50px;text-align:center;color:var(--text-dim)}
@media(max-width:900px){.fr-grid{grid-template-columns:1fr}.fr-preview{position:static;max-height:none}}
